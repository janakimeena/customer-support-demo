# Shared defaults. Profile files (application-<profile>.yml) are loaded on top and win on conflicts.
spring:
  application:
    name: customer-service
  profiles:
    # Used only when no profile is activated (--spring.profiles.active / SPRING_PROFILES_ACTIVE).
    default: dev

server:
  port: 8080

support:
  customer:
    max-customers: 1000
    default-tier: STANDARD

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Day 2 customer service (controller -> service -> repository)
