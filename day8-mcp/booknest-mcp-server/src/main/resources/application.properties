spring.application.name=booknest-mcp

# --- stdio transport (notes §6, §7.8) ---
# No web server: the MCP starter talks JSON-RPC over stdin/stdout.
spring.main.web-application-type=none
spring.ai.mcp.server.stdio=true

# stdout carries ONLY protocol messages. The banner would corrupt the stream,
# and logback-spring.xml sends every log line to stderr.
spring.main.banner-mode=off

# What the client sees in the initialize response.
spring.ai.mcp.server.name=booknest-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=BookNest demo catalogue. Use search_books to find a book ID, then get_book_price with that ID.
# sync = plain blocking methods (the default); async would mean Mono/Flux return types.
spring.ai.mcp.server.type=sync
