# Optional: run the assistant without any API key, on local models. Activate together with dev:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,ollama
# Needs Ollama running (see compose.yaml) with both models pulled. A small local model is much weaker than
# Gemini: expect worse tool use and structured output. That difference is worth seeing once.
spring:
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      chat:
        model: llama3.2
